    <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    .con{
        height: 100vh;
        width: 100%;
        border: 1px solid black;
        text-align: center;
    }
    .header{
        height: 20%;
        width: 100%;
        border: 1px solid black;
        background-color: antiquewhite;
    }
    .footer{
        height: 20%;
        width: 100%;
        border: 1px solid black;
        background-color: gray;
    }
    .middle{
         height: 60%;
         width : 100%;
         border: 1 px solid black;
         background-color: burlywood;
         display: flex;
    }
    .left{
        height: 100%;
        width: 20%;
        border: 1px solid black;
        background-color: violet;
    }
    .right{
        height: 100%;
        width: 80%;
        border: 1px solid black;
        background-color: forestgreen;
    }
    .top{
        height: 50%;
        width: 100%;
        border: 1px solid black;
        background-color: yellowgreen;
    }
    .bottom{
        height: 50%;
        width: 100%;
        border: 1px solid black;
        display: flex;
        background-color: navajowhite;
    }
    .bottom1{
        height: 100%;
        width: 50%;
        border: 1px solid black;
    }
    .bottom2{
        height: 100%;
        width: 50%;
        border: 1px solid black;
    }
    *{
        padding: 0;
        margin: 0;
        box-sizing: border-box;
    }
    h1{
        text-align: center;
    }
    </style>
    
</head>
<body>
    <h1>Flex Boxes</h1>
    <div class="con">
        <div class="header">
            <h1>Header Box</h1>
        </div>
        <div class="middle">
            <div class="left">
                <h1>Left</h1>
            </div>
            <div class="right">
                <div class="top">
                    <h1>Top</h1>
                </div>
                <div class="bottom">
                <div class="bottom1"><h1>Bottom1</h1></div>
                <div class="bottom2"><h1>Bottom2</h1></div>

            </div>
        </div>
        </div>
        <div class="footer"><h1>Footer</h1></div>
    </div>
</body>
</html>
